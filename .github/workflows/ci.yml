name: CI

on:
  push:
    branches: [main, master]
    tags:
      - '*@v*'  # Also run CI on release tags
  pull_request:
    branches: [main, master]
  workflow_call:  # Make it reusable so publish can call it

jobs:
  build:
    name: Build and Type Check
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [20.x]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build packages
        run: npm run build

      - name: Type check example
        run: cd examples/prisma-worker && npx tsc --noEmit
      
      - name: Test
        run: npm run test
