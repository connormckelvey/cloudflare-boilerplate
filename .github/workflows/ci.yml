name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    name: Build and Type Check
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build library
        run: cd packages/prisma && npm run build
      
      - name: Type check library
        run: cd packages/prisma && npx tsc --noEmit
      
      - name: Type check example
        run: cd examples/prisma-worker && npx tsc --noEmit
      
      - name: Build all
        run: npm run build
      
      - name: Test
        run: npm run test

