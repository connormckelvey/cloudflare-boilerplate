name: Publish

on:
  push:
    tags:
      - '*@v*'  # Triggers on package-specific tags like prisma@v0.1.0

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # Required for Trusted Publishing
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Extract package from tag
        id: tag_info
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          # Extract package name (everything before @v)
          PACKAGE_NAME=${TAG%@v*}
          # Extract version (everything after @v) - just for logging
          VERSION=${TAG#*@v}
          echo "package=$PACKAGE_NAME" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Extracted package: $PACKAGE_NAME, version: $VERSION"
          echo "Note: package.json version should already match the tag (updated by release script)"
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'
      
      - name: Install latest npm
        run: npm install -g npm@latest
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build package
        run: cd packages/${{ steps.tag_info.outputs.package }} && npm run build
      
      - name: Run tests
        run: cd packages/${{ steps.tag_info.outputs.package }} && npm test
      
      - name: Publish to npm
        working-directory: packages/${{ steps.tag_info.outputs.package }}
        run: npm publish --provenance
        # Trusted Publishing - no token needed!

